<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление пароля — Конструктор образовательных программ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      width: 48px;
      height: 48px;
      background: #004C97;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .logo svg { width: 24px; height: 24px; stroke: white; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: #14213d; }
    .desc { color: #64748b; font-size: 15px; line-height: 1.5; margin-bottom: 28px; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #334155; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #004C97;
      box-shadow: 0 0 0 3px rgba(0,76,151,0.1);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #004C97;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .btn:hover { background: #003d7a; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .links {
      margin-top: 24px;
      display: flex;
      gap: 16px;
      font-size: 14px;
    }
    .links a { color: #004C97; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .error {
      background: #fef2f2;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .success {
      background: #f0fdf4;
      color: #16a34a;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .reset-link {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      word-break: break-all;
      font-size: 13px;
      display: none;
    }
    .reset-link a {
      color: #004C97;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
      </svg>
    </div>
    <h1>Восстановление пароля</h1>
    <p class="desc">Пока почта не подключена, система покажет одноразовую ссылку восстановления.</p>
    
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    <div class="reset-link" id="resetLink"></div>
    
    <form id="forgotForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <button type="submit" class="btn" id="submitBtn">
        <span>Создать ссылку</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </form>
    
    <div class="links">
      <a href="/login.html">Войти</a>
      <a href="/register.html">Регистрация</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    const resetLinkEl = document.getElementById('resetLink');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      resetLinkEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Подождите...</span>';
      
      try {
        const response = await fetch('/api/auth/password-reset/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const result = await response.json();
        
        if (!response.ok) {
          throw new Error(result.error || 'Не удалось создать ссылку');
        }
        
        if (result.resetUrl) {
          successEl.textContent = 'Ссылка восстановления создана:';
          successEl.style.display = 'block';
          resetLinkEl.innerHTML = `<a href="${result.resetUrl}">${result.resetUrl}</a>`;
          resetLinkEl.style.display = 'block';
        } else {
          successEl.textContent = 'Если email существует, ссылка отправлена.';
          successEl.style.display = 'block';
        }
        
      } catch (err) {
        errorEl.textContent = err.message || 'Не удалось создать ссылку';
        errorEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Создать ссылку</span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>';
      }
    });
  </script>
</body>
</html>
